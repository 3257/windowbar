name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Unit tests
        run: swift test --scratch-path build/swiftpm
      - name: Build native app
        run: zsh build.sh
      - name: Validate app bundle
        run: |
          plutil -lint build/WindowBar.app/Contents/Info.plist
          codesign --verify --strict --verbose=2 build/WindowBar.app
      - name: Isolated native feature checks
        run: python3 Tests/Smoke/verify_isolation.py build/WindowBar.app/Contents/MacOS/WindowBar
      - name: Package universal app
        run: zsh scripts/package-app.sh
      - name: Upload downloadable app
        uses: actions/upload-artifact@v7.0.2
        with:
          path: build/distribution/WindowBar.dmg
          archive: false
          if-no-files-found: error
          retention-days: 30
